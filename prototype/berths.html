<div class="disclaimer" style="margin:0 0 18px;max-width:none">
  Демонстрация внешнего вида. Имена клиентов, номера лодок и телефоны вымышленные, суммы показаны для примера.
</div>

<div class="stats">
  <div class="stat"><div class="l">Усього місць</div><div class="v" id="cAll">0</div></div>
  <div class="stat"><div class="l">Зайнято</div><div class="v in" id="cBusy">0</div></div>
  <div class="stat"><div class="l">Вільно</div><div class="v" id="cFree">0</div></div>
  <div class="stat"><div class="l">Заповненість</div><div class="v" id="cPct">0%</div></div>
</div>

<div class="tools">
  <input class="field" id="q" placeholder="Пошук: номер місця…">
  <div class="filters" id="filters">
    <button class="on" data-f="all">Усі</button>
    <button data-f="busy">Зайняті</button>
    <button data-f="free">Вільні</button>
    <button data-f="вода">На воді</button>
    <button data-f="суша">На суші</button>
    <button data-f="елінг">Елінг</button>
  </div>
  <button class="btn solid act">Додати місце</button>
</div>

<div class="map" id="map"></div>

<div class="grid-card" style="min-height:240px;margin-top:18px">
  <table class="tbl">
    <thead><tr>
      <th>Місце</th><th>Тип</th><th>Макс. довжина</th>
      <th>Човен</th><th>Власник</th><th class="r">Стан</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

</div>

<div class="veil" id="veil"></div>
<aside class="panel" id="panel" aria-label="Подробиці">
  <button class="panel-x" id="closePanel" aria-label="Закрити">×</button>
  <div id="panelBody"></div>
</aside>

<script src="demo.js"></script>
<script src="panel.js"></script>
<script>

let filter = 'all', query = '';

function visible() {
  return SLOTS.filter(sl => {
    const busy = !!stayOf(sl.n);
    if (filter === 'busy' && !busy) return false;
    if (filter === 'free' && busy) return false;
    if (['вода', 'суша', 'елінг'].includes(filter) && sl.k !== filter) return false;
    if (!query) return true;
    return sl.n.toLowerCase().includes(query);
  });
}

function draw() {
  const busyCount = SLOTS.filter(sl => stayOf(sl.n)).length;
  cAll.textContent  = SLOTS.length;
  cBusy.textContent = busyCount;
  cFree.textContent = SLOTS.length - busyCount;
  cPct.textContent  = Math.round(busyCount / SLOTS.length * 100) + '%';

  const list = visible();

  // Схема причалу: одним поглядом видно, де вільно.
  map.innerHTML = list.map((sl, i) => {
    const s = stayOf(sl.n);
    return '<button class="slot-box' + (s ? '' : ' free') + '" data-i="' + i + '">' +
      '<span class="sb-n">' + sl.n + '</span>' +
      '<span class="sb-k">' + (s ? s.boat : 'вільне') + '</span>' +
      '</button>';
  }).join('');

  rows.innerHTML = list.length
    ? list.map((sl, i) => {
        const s = stayOf(sl.n);
        return '<tr data-i="' + i + '">' +
          '<td data-l="Місце"><span class="bchip' + (s ? '' : ' free') + '">' + sl.n + '</span></td>' +
          '<td data-l="Тип" class="dim">' + sl.k + '</td>' +
          '<td data-l="Макс. довжина" class="dim">' + sl.max + '</td>' +
          '<td data-l="Човен">' + (s ? '<span class="strong">' + s.boat + '</span>' : '<span class="dim">—</span>') + '</td>' +
          '<td data-l="Власник">' + (s ? s.owner : '<span class="dim">—</span>') + '</td>' +
          '<td data-l="Стан"><span class="badge ' + (s ? 'sent' : '') + '">' +
            (s ? 'Зайняте' : 'Вільне') + '</span></td>' +
          '</tr>';
      }).join('')
    : '<tr><td colspan="6" class="dim" style="text-align:center">Нічого не знайшлось</td></tr>';

  [...map.querySelectorAll('[data-i]')].forEach(b => {
    b.onclick = () => berthPanel(list[+b.dataset.i]);
  });
  [...rows.querySelectorAll('tr[data-i]')].forEach(tr => {
    tr.onclick = () => berthPanel(list[+tr.dataset.i]);
  });
}

q.oninput = e => { query = e.target.value.trim().toLowerCase(); draw(); };
filters.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...filters.children].forEach(x => x.classList.toggle('on', x === b));
  filter = b.dataset.f; draw();
};
draw();
</script>
</body>
